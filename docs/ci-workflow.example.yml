name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  client:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
